id: CHG-2026-001
title: Initial delivery stack
release_class: experiment
version: 0.1.0
behavior_change: true
issue: "1"
threats: >
  The skeleton exposes a public health check and a public example item list.
  Item creation requires a Cognito token. Unauthenticated callers receive 401,
  and missing Cognito configuration returns 503 rather than accepting a token.
rollback: >
  Redeploy the previous ECS task definition recorded in the deploy job summary.
  The database change is additive and can stay in place.
requirements:
  - id: REQ-1
    statement: The home page shows the product name.
    acceptance: Playwright opens the web app and reads the level-one heading.
  - id: REQ-2
    statement: The API reports that it is up.
    acceptance: Playwright calls GET /health and receives status ok.
  - id: REQ-3
    statement: The API returns the example item.
    acceptance: Playwright calls GET /items and finds an item named example.
