  implementation: passed
  new_playwright_tests: passed
  snyk: pending
  secret_scanning: pending
  playwright: pending
  deploy_dev: pending
  deploy_test: pending
  uat_approval: pending
  deploy_staging: pending
  deploy_preprod: pending
  k6: pending
  zap: pending
  prod_approval: pending
  deploy_prod: pending
environments_approved: []
deviations:
  - id: DEV-002
    what: Route /auth and /auth/* on the existing load balancer to the API service.
    rule: Changes under infra/ need an approved deviation.
    why: Sign-in uses the current API and load balancer. It does not add a service.
    pipeline_steps_still_run: All seventeen gates stay in the workflows.
    approved_by: operator
