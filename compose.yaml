services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: saas
      POSTGRES_DB: saas
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas -d saas"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://saas:saas@postgres:5432/saas
      PRODUCT_NAME: ${PRODUCT_NAME:-example}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_PRODUCT_NAME: ${PRODUCT_NAME:-example}
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    environment:
      API_PROXY_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
