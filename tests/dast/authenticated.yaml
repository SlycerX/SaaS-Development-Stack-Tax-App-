---
env:
  contexts:
    - name: app
      urls:
        - ${ZAP_TARGET}
      includePaths:
        - ${ZAP_TARGET}.*
      authentication:
        method: manual
      sessionManagement:
        method: http
  parameters:
    failOnError: true
    progressToStdout: true
jobs:
  - type: replacer
    rules:
      - description: bearer token
        matchType: req_header
        matchString: Authorization
        replacementString: "Bearer ${ZAP_AUTH_TOKEN}"
        initiators: true
  - type: spider
    parameters:
      context: app
      url: ${ZAP_TARGET}
  - type: passiveScan-wait
    parameters:
      maxDuration: 5
  - type: activeScan
    parameters:
      context: app
      maxRuleDurationInMins: 5
      maxScanDurationInMins: 15
  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk
      reportFile: zap-report.json
